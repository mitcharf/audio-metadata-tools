[project]
name = "audio-library-tools"
version = "0.1.0"
description = "Audio Library Tooling Ecosystem"
requires-python = ">=3.14"
dependencies = [
    "typer",
    "rich",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
]

[project.scripts]
library = "library_cli.main:run"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["lib*", "library_cli*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
